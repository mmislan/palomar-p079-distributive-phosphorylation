  "project": {
    "name": "Exact equilibrium and stable-state capacities of distributive phosphorylation",
    "description": "The equilibrium and stable-state capacities of the sequential distributive n-site phosphorylation cycle are determined for every n >= 1. The positive-equilibrium ceiling is 2n-1, and the ceiling for locally asymptotically stable positive equilibria is n, including nonhyperbolic attractors. Both bounds are attained simultaneously by one rational choice of rates and totals: exactly 2n-1 rational positive equilibria consist of n hyperbolic sinks and n-1 saddles with one unstable direction. This configuration persists on a nonempty open set in the full rate-and-total parameter space. The construction also yields quantitative eigenvalue splitting, compact-current refinements, prescribed-root coefficient and interlacing results, explicit finite spectra, and a three-site example with local robustness, recovery and measured-readout guarantees.",
    "authors": [
      "Michael Mislan"
    ],
